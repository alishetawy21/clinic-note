
name: ClinNote Professional Android Build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: clinnote-android-build
  cancel-in-progress: true

jobs:
  build:
    name: Compile and Package ClinNote
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Configure Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        uses: android-actions/setup-android@v4

      - name: Install required Android SDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install \
            "platforms;android-36.1" \
            "build-tools;36.0.0" \
            "platform-tools"

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-cleanup: on-success

      - name: Generate debug signing key
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Verify Android SDK
        run: |
          test -d "$ANDROID_HOME/platforms/android-36.1"
          test -d "$ANDROID_HOME/build-tools/36.0.0"
          java -version
          gradle --version

      - name: Compile debug APK
        run: |
          gradle --no-daemon --stacktrace \
            :app:assembleDebug

      - name: Verify APK output
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: ClinNote-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
